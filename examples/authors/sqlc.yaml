version: '2'
sql:
- name: sqlite
  schema: sqlite/schema.sql
  queries: sqlite/query.sql
  engine: sqlite
  database:
    uri: file:authors?mode=memory&cache=shared
  rules:
  - sqlc/db-prepare
  gen:
    go:
      package: authors
      out: sqlite
- name: duckdb
  schema: duckdb/schema.sql
  queries: duckdb/query.sql
  engine: duckdb
  gen:
    go:
      package: authors
      out: duckdb
      rename:
        data_json: DataJSON
        preferences_json: PreferencesJSON
      overrides:
      - column: main.authors.data_json
        go_type:
          type: map[string]any
      - column: main.authors.preferences_json
        go_type:
          type: '[]any'
- name: mssql
  schema: mssql/schema.sql
  queries: mssql/query.sql
  engine: mssql
  gen:
    go:
      package: authors
      out: mssql
rules:
- name: postgresql-query-too-costly
  message: "Too costly"
  rule: "postgresql.explain.plan.total_cost > 300.0"
- name: mysql-query-too-costly
  message: "Too costly"
  rule: "has(mysql.explain.query_block.cost_info) && double(mysql.explain.query_block.cost_info.query_cost) > 2.0"
