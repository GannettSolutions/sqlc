version: "2"
sql:
  - engine: "duckdb"
    schema: "schema.sql"
    queries: "query.sql"
    gen:
      go:
        package: "querytest"
        out: "go"
        sql_package: "database/sql"
        overrides:
          - column: main.things.doc
            go_type:
              import: encoding/json
              type: RawMessage
